x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:
  proxy:
    image: nginx:1-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx_internal.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - torrents-csv
      - torrents-csv-leptos

  torrents-csv-leptos:
    image: dessalines/torrents-csv-leptos:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - RUST_LOG="warn"
      - TORRENTS_CSV_ENDPOINT=http://torrents-csv:8902

  torrents-csv:
    image: dessalines/torrents-csv-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8902:8902"
    environment:
      TORRENTS_CSV_DB_HOST: "postgres://postgres:password@db"
      TORRENTS_CSV_FRONT_END_DIR: /app/dist
      RUST_LOG: DEBUG
    depends_on:
      - db

  db:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
      - ./init-database.sql:/var/lib/postgresql/init-database.sql
      - ./torrents.csv:/var/lib/postgresql/torrents.csv
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
